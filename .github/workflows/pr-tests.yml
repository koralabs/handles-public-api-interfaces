name: PR validation
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    name: Build public TypeScript interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
