name: handles-public-api-interfaces
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  id-token: write  # Required for OIDC
  contents: read
  packages: write  # Required for GitHub Packages publish
jobs:
  deploy:
    name: Deploying from ${{ github.ref_name }}
    environment: mainnet
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build && cp package.json README.md LICENSE ./lib/

    # npmjs is the canonical public registry consumers (incl. the Cardano SDK) resolve
    # from, so publish it first. The two registry publishes are independent: a failure
    # or duplicate-version on one must not skip the other (hence `if: ${{ !cancelled() }}`
    # on the second). Publishing is tokenless via npm Trusted Publishing (OIDC).
    - name: Publish to npmjs
      run: cd ./lib && npm publish --provenance --access public

    - name: Publish to GitHub Packages
      if: ${{ !cancelled() }}
      run: |
        npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
        cd ./lib && npm publish --@koralabs:registry='https://npm.pkg.github.com'
